# ============================================================
#  設計書 book プロジェクト（Quarto → HTML / PDF）
#
#  このファイルは ddq init / ddq add が置いた雛形である。発行者が文書に合わせて
#  書き換える（表題・資料番号・会社名・章の並び）。
#
#  1ファイル = 1章。章の中をさらに節・項に割るときは {{< include >}} を使う。
#  400〜1000ページ級の設計書を想定し、HTML は章ごとの別ページに分割して出す
#  （単一 HTML は図の base64 内包で数十 MB になり実用に耐えないため）。
#  PDF は1ファイルで、章番号・図表番号・相互参照は章をまたいで連続する。
#
#  執筆者は Quarto と VSCode 拡張だけで HTML を出せる（ddq は不要）。
#  PDF（発行版）は発行者が ddq を使って出す。PDF 用の設定は
#  _quarto-publish.yml（発行者の setup が置く）にあり、このファイルには無い。
#
#  注意（book 特有の落とし穴）:
#   - include のパスは「その章ファイルのあるディレクトリ」基準（入れ子でも同じ）
#   - chapters に並べたファイルの先頭見出しは h1（章）に昇格される。
#     長い章を分割するときは章ファイルを1つ立て、そこから include すること。
#   - 画像はプロジェクトルート基準の /diagrams/... で書く（../ は Windows で
#     バックスラッシュ結合され typst 0.15 以降が拒否するため）
# ============================================================
project:
  type: book
  output-dir: _book
  # 図表番号を PDF と同じ「章.節-連番」に振り直す後処理。
  # quarto render / quarto preview のたびに Quarto 同梱の Deno で走る（node 不要）。
  post-render:
    - postprocess-html.js

book:
  title: 受注管理システム プログラム概要設計書
  subtitle: サンプル（PlantUML による内部仕様の記述例）
  author: 設計チーム
  # 発行版 PDF のファイル名（拡張子 .pdf は付けない）。_book/ に この名前.pdf ができる。
  # 省略すると Quarto が title から付ける。資料番号を入れておくと配布物の取り違えが減る。
  # ddq pdf が取り出す中間版は名前を変えず design-doc.pdf のまま。
  output-file: SD-2026-002_受注管理システム概要設計書
  # 章の並び。1ファイル = 1章。増やしたらここに追記する。
  chapters:
    - index.qmd
    - chapters/01-overview/index.qmd
    - chapters/02-design-policy/index.qmd
    - chapters/03-design-conditions/index.qmd
    - chapters/04-structure/index.qmd
    - chapters/05-functions/index.qmd
    - chapters/06-performance/index.qmd
    - chapters/07-internal-files/index.qmd
    - chapters/08-internal-db/index.qmd
    - chapters/09-tables/index.qmd
    - chapters/10-memory/index.qmd
    - chapters/11-evaluation/index.qmd
    - chapters/12-plantuml-examples/index.qmd

lang: ja
# PlantUML 図（```plantuml）を描く LAN 内のサーバ。設定すると執筆者・発行者とも、
# 自分の端末に Java や plantuml.jar が無くても図が出る（利用マニュアル 8 章・11 章）。
# 例: plantuml-server: http://plantuml.example.local:8080
# 空なら、ローカルの `ddq plantuml serve`（既定 http://127.0.0.1:18080）を探す。
plantuml-server: ""
doc-number: SD-2026-002
doc-revision: ""       # 改訂記号（A〜Z / NC）。doc-number の末尾に結合して資料番号に表示。空=改訂記号なし
spec: false            # スペック様式（全ページ上部に表題欄）にするか。true でスペック様式
company-ja: ソフト開発株式会社            # 様式フッターの会社名（日本語）
company-en: Soft Development Co., Ltd.          # 様式フッターの会社名（英語）
page-start: 1          # PDF の開始ページ番号。表紙・前書きを別文書で作り、その続きとして綴じるときに使う（前付けが4ページなら 5）
pagebreak-level: 1     # PDF で見出しの先頭に自動改ページを入れる最深レベル。0=入れない、1=章(#)、2=章と節(##。各章で2つ目以降の節のみ)

toc: true
toc-location: left     # ページ内目次を右マージンから左へ移す（本文を広く取る）
toc-title: 目 次
toc-depth: 3

format:
  # 執筆者が内容を確認するための HTML。章ごとに別ページ・共通アセットは
  # site_libs/ に1回だけ。全文検索（search.json）も自動で付くが、利用には HTTP 配信が必要。
  # 発行版の HTML も同じ設定で出る（違うのは mermaid の描き方だけ）。
  html:
    number-sections: true
    css: design-doc.css
    embed-resources: false
    # 画面幅の基準を 1920px にする（Quarto 既定は sidebar 250 + body 800 +
    # margin 250 ≒ 1280px）。左ペイン（sidebar）は「章番号 + 見出し15文字」＋
    # ページ内目次（toc-location: left で左に移動）が折り返さずに収まる幅。
    # 合計 300 + 1560 + 60 = 1920px。
    grid:
      sidebar-width: 300px
      body-width: 1560px
      margin-width: 60px

filters:
  - design-doc.lua
