<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" width="100%" role="img" aria-label="受注入力画面">
  <style>
    .t     { font-family: 'Yu Gothic','Noto Sans CJK JP',sans-serif; }
    .title { fill:#ffffff; font-size:15px; font-weight:bold; }
    .menu  { fill:#33405a; font-size:13px; }
    .label { fill:#33405a; font-size:13px; }
    .val   { fill:#1f2733; font-size:13px; }
    .ro    { fill:#5a6472; font-size:13px; }
    .hd    { fill:#33405a; font-size:12px; font-weight:bold; }
    .cell  { fill:#1f2733; font-size:12px; }
    .btnp  { fill:#ffffff; font-size:13px; font-weight:bold; }
    .btns  { fill:#33405a; font-size:13px; }
    .status{ fill:#7a5b12; font-size:13px; }
    .req   { fill:#c0392b; font-size:12px; }
  </style>

  <!-- window body -->
  <rect x="10" y="10" width="700" height="480" rx="8" fill="#ffffff" stroke="#c2c8d2" stroke-width="1.5"/>

  <!-- title bar -->
  <path d="M10 48 L10 18 Q10 10 18 10 L702 10 Q710 10 710 18 L710 48 Z" fill="#2c5985"/>
  <text class="t title" x="26" y="34">受注入力</text>
  <text class="t" x="656" y="34" fill="#cdd8e8" font-size="15">&#8211; &#9723; &#10005;</text>

  <!-- menu bar -->
  <rect x="10" y="48" width="700" height="26" fill="#f2f4f7"/>
  <line x1="10" y1="74" x2="710" y2="74" stroke="#dfe3ea"/>
  <text class="t menu" x="26" y="66">ファイル</text>
  <text class="t menu" x="92" y="66">編集</text>
  <text class="t menu" x="146" y="66">表示</text>
  <text class="t menu" x="200" y="66">ヘルプ</text>

  <!-- form: customer -->
  <text class="t label" x="34" y="112">顧客ID</text>
  <rect x="120" y="98" width="120" height="24" rx="3" fill="#ffffff" stroke="#9aa4b2"/>
  <text class="t val" x="128" y="115">C0001</text>
  <text class="t req" x="246" y="112">必須</text>
  <rect x="288" y="98" width="56" height="24" rx="3" fill="#2c5985"/>
  <text class="t btnp" x="298" y="115" font-size="12">検索</text>
  <text class="t label" x="380" y="112">顧客名</text>
  <rect x="440" y="98" width="250" height="24" rx="3" fill="#eceff3" stroke="#c2c8d2"/>
  <text class="t ro" x="448" y="115">株式会社サンプル商事</text>

  <!-- form: product -->
  <text class="t label" x="34" y="150">商品コード</text>
  <rect x="120" y="136" width="120" height="24" rx="3" fill="#ffffff" stroke="#9aa4b2"/>
  <text class="t val" x="128" y="153">P-10023</text>
  <text class="t req" x="246" y="150">必須</text>
  <text class="t label" x="380" y="150">商品名</text>
  <rect x="440" y="136" width="250" height="24" rx="3" fill="#eceff3" stroke="#c2c8d2"/>
  <text class="t ro" x="448" y="153">A4コピー用紙 500枚</text>

  <!-- form: quantity / unit price / amount -->
  <text class="t label" x="34" y="188">数量</text>
  <rect x="120" y="174" width="80" height="24" rx="3" fill="#ffffff" stroke="#9aa4b2"/>
  <text class="t val" x="180" y="191" text-anchor="end">10</text>
  <text class="t req" x="206" y="188">必須</text>
  <text class="t label" x="260" y="188">単価</text>
  <rect x="310" y="174" width="100" height="24" rx="3" fill="#eceff3" stroke="#c2c8d2"/>
  <text class="t ro" x="402" y="191" text-anchor="end">¥480</text>
  <text class="t label" x="440" y="188">金額</text>
  <rect x="500" y="174" width="190" height="24" rx="3" fill="#eceff3" stroke="#c2c8d2"/>
  <text class="t ro" x="682" y="191" text-anchor="end">¥4,800</text>

  <!-- detail grid -->
  <text class="t hd" x="34" y="228">受注明細</text>
  <rect x="34" y="238" width="656" height="24" fill="#eef1f5" stroke="#c2c8d2"/>
  <line x1="80"  y1="238" x2="80"  y2="358" stroke="#dfe3ea"/>
  <line x1="200" y1="238" x2="200" y2="358" stroke="#dfe3ea"/>
  <line x1="470" y1="238" x2="470" y2="358" stroke="#dfe3ea"/>
  <line x1="560" y1="238" x2="560" y2="358" stroke="#dfe3ea"/>
  <text class="t hd" x="48"  y="254">行</text>
  <text class="t hd" x="112" y="254">商品コード</text>
  <text class="t hd" x="300" y="254">商品名</text>
  <text class="t hd" x="500" y="254">数量</text>
  <text class="t hd" x="600" y="254">金額</text>
  <!-- rows -->
  <rect x="34" y="262" width="656" height="24" fill="#ffffff" stroke="#eceff3"/>
  <text class="t cell" x="52"  y="278">1</text>
  <text class="t cell" x="92"  y="278">P-10023</text>
  <text class="t cell" x="212" y="278">A4コピー用紙 500枚</text>
  <text class="t cell" x="548" y="278" text-anchor="end">10</text>
  <text class="t cell" x="678" y="278" text-anchor="end">¥4,800</text>
  <rect x="34" y="286" width="656" height="24" fill="#f7f9fb" stroke="#eceff3"/>
  <text class="t cell" x="52"  y="302">2</text>
  <text class="t cell" x="92"  y="302">P-20510</text>
  <text class="t cell" x="212" y="302">ボールペン 黒 10本入</text>
  <text class="t cell" x="548" y="302" text-anchor="end">5</text>
  <text class="t cell" x="678" y="302" text-anchor="end">¥1,500</text>
  <rect x="34" y="310" width="656" height="48" fill="#ffffff" stroke="#eceff3"/>

  <!-- total -->
  <text class="t label" x="470" y="382">合計金額</text>
  <rect x="560" y="368" width="130" height="26" rx="3" fill="#eceff3" stroke="#c2c8d2"/>
  <text class="t val" x="682" y="386" text-anchor="end" font-weight="bold">¥6,300</text>

  <!-- buttons -->
  <rect x="470" y="408" width="100" height="30" rx="4" fill="#ffffff" stroke="#9aa4b2"/>
  <text class="t btns" x="500" y="428">クリア (F9)</text>
  <rect x="586" y="408" width="104" height="30" rx="4" fill="#2c5985"/>
  <text class="t btnp" x="612" y="428">登録 (F12)</text>

  <!-- status / message bar -->
  <rect x="10" y="452" width="700" height="38" rx="0" fill="#fff8e1"/>
  <path d="M10 452 h700 v30 q0 8 -8 8 L18 490 Q10 490 10 482 Z" fill="#fff8e1" stroke="#e6d08a"/>
  <text class="t status" x="26" y="476">顧客ID・商品コード・数量を入力し F12 で登録してください。</text>
</svg>
