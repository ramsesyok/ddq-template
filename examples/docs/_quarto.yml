# ============================================================
#  設計書 book プロジェクト（Quarto → PDF / Typst）
#
#  1ファイル = 1章。章の中をさらに節・項に割るときは {{< include >}} を使う。
#  400〜1000ページ級の設計書を想定し、HTML は章ごとの別ページに分割して出す
#  （単一 HTML は図の base64 内包で数十 MB になり実用に耐えないため）。
#  PDF は従来どおり1ファイルで、章番号・図表番号・相互参照は章をまたいで連続する。
#
#  様式・変換の実体は template/（ddq に埋め込まれる原本）にある（執筆者は触らない）。このフォルダに
#  置かれる design-doc.lua / design-doc.css / postprocess-html.js / mermaid-config.json は
#  その写しで、setup（発行者）または update-doc が配置する。実際の設計書リポジトリでは
#  これらはコミット対象になり、ddq が無くても執筆者が HTML を出せる。
#  PDF 用の設定は _quarto-publish.yml（setup が配置）にあり、このファイルには無い。
#  ビルドは `ddq pdf <このフォルダのパス>`（詳細はテンプレート設計書 docs/design/）。
#
#  注意（book 特有の落とし穴。詳細はテンプレート設計書 docs/design/ 7章）:
#   - include のパスは「その章ファイルのあるディレクトリ」基準（入れ子でも同じ）
#   - chapters に並べたファイルの先頭見出しは h1（章）に昇格される。
#     長い章を分割するときは章ファイルを1つ立て、そこから include すること。
#   - 画像はプロジェクトルート基準の /diagrams/... で書く（../ は Windows で
#     バックスラッシュ結合され typst 0.15 以降が拒否するため）
# ============================================================
project:
  type: book
  output-dir: _book
  # 図表番号を PDF と同じ「章.節-連番」に振り直す後処理。
  # quarto render / quarto preview のたびに Quarto 同梱の Deno で走る（node 不要）。
  post-render:
    - postprocess-html.js

book:
  title: 受注管理システム 基本設計書
  subtitle: サンプル・ボイラープレート
  author: 設計チーム
  chapters:
    - index.qmd
    - chapters/01-overview/index.qmd
    - chapters/02-design-policy/index.qmd
    - chapters/03-design-conditions/index.qmd
    - chapters/04-system/index.qmd
    - chapters/05-requirements/index.qmd
    - chapters/06-functions/index.qmd
    - chapters/07-performance/index.qmd
    - chapters/08-io-data/index.qmd
    - chapters/09-screens/index.qmd
    - chapters/10-files/index.qmd
    - chapters/11-database/index.qmd
    - chapters/12-fault/index.qmd
    - chapters/13-evaluation/index.qmd
    - chapters/14-tbl-examples/index.qmd

lang: ja
doc-number: SD-2026-001
doc-revision: ""       # 改訂記号（A〜Z / NC）。doc-number の末尾に結合して資料番号に表示。空=改訂記号なし
spec: false            # スペック様式（全ページ上部に表題欄）にするか。true でスペック様式
company-ja: ソフト開発株式会社   # スペック様式フッターの会社名（日本語）
company-en: Soft Development Co., Ltd.   # スペック様式フッターの会社名（英語）

toc: true
toc-location: left     # ページ内目次を右マージンから左へ移す（本文を広く取る）
toc-title: 目 次
toc-depth: 3

format:
  # 執筆者が内容を確認する HTML（発行版の HTML も同じ設定で出る。違いは mermaid の
  # 描き方だけ）。章ごとに別ページ・共通アセットは site_libs/ に1回だけ置かれ、
  # 全文検索（search.json）も自動で付く。
  html:
    number-sections: true
    # css はローカル参照にしておく（Quarto が _book/ に取り込み、単体で配信・zip
    # できるようにするため）。
    css: design-doc.css
    embed-resources: false
    # 画面幅の基準を 1920px にする（Quarto 既定は sidebar 250 + body 800 +
    # margin 250 ≒ 1280px）。左ペイン（sidebar）は「章番号 + 見出し15文字」＋
    # ページ内目次（toc-location: left で左に移動）が折り返さずに収まる幅。
    # ページ内目次を左へ寄せたぶん右マージンは詰め、本文を広く取る。
    # 合計 300 + 1560 + 60 = 1920px。
    grid:
      sidebar-width: 300px
      body-width: 1560px
      margin-width: 60px

filters:
  - design-doc.lua
