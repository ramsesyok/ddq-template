# ============================================================
#  設計書 book プロジェクト（Quarto → HTML / PDF）
#
#  このファイルは ddq init が置く雛形と同じ構成である。発行者が文書に合わせて
#  書き換える（表題・資料番号・会社名・章の並び）。
#
#  1ファイル = 1章。章の中をさらに節・項に割るときは {{< include >}} を使う。
#  400〜1000ページ級の設計書を想定し、HTML は章ごとの別ページに分割して出す
#  （単一 HTML は図の base64 内包で数十 MB になり実用に耐えないため）。
#  PDF は1ファイルで、章番号・図表番号・相互参照は章をまたいで連続する。
#
#  執筆者は Quarto と VSCode 拡張だけで HTML を出せる（node も template/ も不要）。
#  PDF（中間版・発行版）は発行者が ddq を使って出す。PDF 用の設定は
#  _quarto-publish.yml（発行者の setup が置く）にあり、このファイルには無い。
#
#  注意（book 特有の落とし穴）:
#   - include のパスは「その章ファイルのあるディレクトリ」基準（入れ子でも同じ）
#   - chapters に並べたファイルの先頭見出しは h1（章）に昇格される。
#     長い章を分割するときは章ファイルを1つ立て、そこから include すること。
#   - 画像はプロジェクトルート基準の /diagrams/... で書く（../ は Windows で
#     バックスラッシュ結合され typst 0.15 以降が拒否するため）
# ============================================================
project:
  type: book
  output-dir: _book
  # 図表番号を PDF と同じ「章.節-連番」に振り直す後処理。
  # quarto render / quarto preview のたびに Quarto 同梱の Deno で走る（node 不要）。
  post-render:
    - postprocess-html.js

book:
  title: 移行支援スクリプト プログラム詳細設計書
  subtitle: ""
  author: RamsesYok
  # 章の並び。1ファイル = 1章。増やしたらここに追記する。
  chapters:
    - index.qmd
    - chapters/01-overview/index.qmd
    - chapters/02-design-policy/index.qmd
    - chapters/03-design-conditions/index.qmd
    - chapters/04-modules/index.qmd
    - chapters/05-local-tables/index.qmd
    - chapters/06-messages/index.qmd
    - chapters/07-memory/index.qmd
    - chapters/08-evaluation/index.qmd

lang: ja
doc-number: ""
doc-revision: ""       # 改訂記号（A〜Z / NC）。doc-number の末尾に結合して資料番号に表示。空=改訂記号なし
spec: false            # スペック様式（全ページ上部に表題欄）にするか。true でスペック様式
company-ja: ""   # 様式フッターの会社名（日本語）
company-en: ""   # 様式フッターの会社名（英語）

toc: true
toc-location: left     # ページ内目次を右マージンから左へ移す（本文を広く取る）
toc-title: 目 次
toc-depth: 3

format:
  # 執筆者が内容を確認するための HTML。章ごとに別ページ・共通アセットは
  # site_libs/ に1回だけ。全文検索（search.json）も自動で付く。
  # 発行版の HTML も同じ設定で出る（違うのは mermaid の描き方だけ）。
  html:
    number-sections: true
    css: design-doc.css
    embed-resources: false
    # 画面幅の基準を 1920px にする（Quarto 既定は sidebar 250 + body 800 +
    # margin 250 ≒ 1280px）。左ペイン（sidebar）は「章番号 + 見出し15文字」＋
    # ページ内目次（toc-location: left で左に移動）が折り返さずに収まる幅。
    # 合計 300 + 1560 + 60 = 1920px。
    grid:
      sidebar-width: 300px
      body-width: 1560px
      margin-width: 60px

filters:
  - design-doc.lua
