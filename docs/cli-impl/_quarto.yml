project:
  type: book
  output-dir: _book
  post-render:
    - postprocess-html.js
book:
  title: "ddq ソフトウェア実装仕様書"
  subtitle: "Software Implementation Specification — テンプレート 2.4.0"
  date: "2026-09-23"
  chapters:
    - index.qmd
    - 01-overview.qmd
    - 02-architecture.qmd
    - 03-behavior.qmd
    - 04-data-interfaces.qmd
    - 05-build-environment.qmd
    - 06-maintenance.qmd
    - 07-issues-unknowns.qmd
