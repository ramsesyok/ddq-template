# ============================================================
#  設計書テンプレート 設計書（Quarto → PDF / HTML）
#
#  本テンプレート自身の設計（様式・変換の仕組みと保守の考え方）を、本テンプレートで
#  書いた文書。読者はテンプレートの保守者。旧 ADVANCED.md と template/PIPELINE.md を
#  統合したもの。
#  構成の規約は利用マニュアル（../manual）と同じ（1ファイル = 1章、章の中は include で分割）。
#  様式・変換の実体は template/（原本）にある。このフォルダ直下の design-doc.lua 等は
#  配置ツールが置く写し（このリポジトリでは git 管理外）。
#
#  ビルドはリポジトリのルートから:
#    cli\target\release\ddq.exe pdf  docs\design  … PDF  → docs\design\design-doc.pdf
#    cli\target\release\ddq.exe html docs\design  … HTML → docs\design\_book\index.html
# ============================================================
project:
  type: book
  output-dir: _book
  # 図表番号を PDF と同じ「章.節-連番」に振り直す後処理（Quarto 同梱 Deno。node 不要）。
  post-render:
    - postprocess-html.js

book:
  title: 設計書テンプレート 設計書
  subtitle: 様式と変換の仕組み・保守の考え方
  author: テンプレート保守チーム
  chapters:
    - index.qmd
    - chapters/01-overview/index.qmd
    - chapters/02-repository/index.qmd
    - chapters/03-pipeline/index.qmd
    - chapters/04-files/index.qmd
    - chapters/05-pdf/index.qmd
    - chapters/06-html/index.qmd
    - chapters/07-filter/index.qmd
    - chapters/08-version/index.qmd
    - chapters/09-maintenance/index.qmd

lang: ja
doc-number: TPL-2026-001
doc-revision: ""       # 改訂記号（A〜Z / NC）。doc-number の末尾に結合。空=改訂記号なし
spec: false            # スペック様式（全ページ上部に表題欄）にするか
company-ja: ソフト開発株式会社
company-en: Soft Development Co., Ltd.

toc: true
toc-location: left
toc-title: 目 次
toc-depth: 3

format:
  html:
    number-sections: true
    css: design-doc.css
    embed-resources: false
    grid:
      sidebar-width: 300px
      body-width: 1560px
      margin-width: 60px

filters:
  - design-doc.lua
