# ============================================================
#  設計書テンプレート 利用マニュアル（Quarto → PDF / HTML）
#
#  本テンプレート自身の使い方を、本テンプレートで書いた文書。
#  構成の規約は examples/docs/ のサンプルと同じ（1ファイル = 1章、章の中は include で分割）。
#  様式・変換の実体は template/（ddq に埋め込まれる原本）にある（このフォルダ直下の
#  design-doc.lua 等は update が置く写し。詳細は examples/docs/_quarto.yml の先頭コメントと
#  テンプレート設計書 docs/design/）。
#
#  ビルドはリポジトリのルートから:
#    cli\target\release\ddq.exe pdf  docs\manual  … PDF  → docs\manual\design-doc.pdf
#    cli\target\release\ddq.exe html docs\manual  … HTML → docs\manual\_book\index.html
# ============================================================
project:
  type: book
  output-dir: _book
  # 図表番号を PDF と同じ「章.節-連番」に振り直す後処理（Quarto 同梱 Deno。node 不要）。
  post-render:
    - postprocess-html.js

book:
  title: 設計書テンプレート 利用マニュアル
  subtitle: Markdown で書いて PDF にする
  author: テンプレート保守チーム
  chapters:
    - index.qmd
    - chapters/01-overview/index.qmd
    - chapters/02-setup-common/index.qmd
    - chapters/03-author-env/index.qmd
    - chapters/04-authoring-doc/index.qmd
    - chapters/05-review/index.qmd
    - chapters/06-markdown/index.qmd
    - chapters/07-structure/index.qmd
    - chapters/08-figure/index.qmd
    - chapters/09-table/index.qmd
    - chapters/10-ipo/index.qmd
    - chapters/11-publisher-env/index.qmd
    - chapters/12-build/index.qmd
    - chapters/13-revision/index.qmd
    - chapters/14-trouble/index.qmd
    - chapters/15-limitations/index.qmd
    - chapters/16-cheatsheet/index.qmd
    - chapters/17-repository/index.qmd
    - chapters/18-maintainer/index.qmd

lang: ja
doc-number: MAN-2026-001
doc-revision: ""       # 改訂記号（A〜Z / NC）。doc-number の末尾に結合。空=改訂記号なし
spec: false            # スペック様式（全ページ上部に表題欄）にするか
company-ja: ソフト開発株式会社
company-en: Soft Development Co., Ltd.

toc: true
toc-location: left
toc-title: 目 次
toc-depth: 3

format:
  html:
    number-sections: true
    css: design-doc.css
    embed-resources: false
    grid:
      sidebar-width: 300px
      body-width: 1560px
      margin-width: 60px

filters:
  - design-doc.lua
