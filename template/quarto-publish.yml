# ============================================================
#  PDF（発行版）を出すときだけ有効になる設定。
#
#  setup が執筆フォルダ直下へ `_quarto-publish.yml` としてコピーし、
#  ddq pdf が `quarto render --to typst --profile publish` で読み込ませる。
#
#  なぜ _quarto.yml に直接書かないのか:
#    typst の template-partials は「ファイルが実在すること」を render 前に要求する。
#    doc リポジトリには template/ が無いため、_quarto.yml に書いてあると
#    執筆者の `quarto render`（フォーマット無指定＝全形式）が必ず失敗する。
#    プロファイルに分ければ、執筆者の既定は HTML だけになる。
#
#  partials と lib.typ は setup が執筆フォルダ直下へ置く（typst の import は
#  プロジェクト外を読めないため、実体がプロジェクト内に無いとコンパイルできない）。
# ============================================================
format:
  typst:
    template-partials:
      - typst-template.typ
      - typst-show.typ
