# 配布物の PDF（はじめかた.pdf・利用マニュアル）に使う日本語の書体を、Windows のランナーで Typst から見えるようにする。
# 求める書体は template/lib.typ の本文（JP-SANS）と等幅（MONO）の最初の候補（cli/tools/check_release.py --expected-fonts）。
# 英語版の Windows には入っていないことがあり、無いと別の書体に落ちて紙面が変わるので、無ければ Windows の
# 「日本語の追加フォント」（Language.Fonts.Jpan）を入れる。入れても見えなければ失敗する。
# 前提: リポジトリを checkout 済み、Quarto（quarto typst）と Python がある。
name: 日本語の書体
description: template/lib.typ の書体を Typst から見えるようにする（Windows）
runs:
  using: composite
  steps:
    - name: 日本語の書体を確かめる（無ければ入れる）
      shell: pwsh
      run: |
        [Console]::OutputEncoding = [Text.UTF8Encoding]::new()
        $want = @(python cli/tools/check_release.py --expected-fonts)
        if ($LASTEXITCODE -ne 0 -or $want.Count -eq 0) { throw "求める書体を読めません" }
        # quarto typst fonts は一覧を標準エラーに出すので、cmd で標準出力にまとめて受け取る
        function Get-MissingFont { $have = @(cmd /c "quarto typst fonts 2>&1" | ForEach-Object { $_.Trim() }); $want | Where-Object { $have -notcontains $_ } }
        $missing = @(Get-MissingFont)
        if ($missing.Count -gt 0) {
          Write-Host "Typst から見えない書体: $($missing -join ', ')。日本語の追加フォントを入れる"
          dism.exe /Online /Add-Capability /CapabilityName:Language.Fonts.Jpan~~~und-JPAN~0.0.1.0 /NoRestart
          if ($LASTEXITCODE -ne 0 -and $LASTEXITCODE -ne 3010) { throw "dism が失敗しました（$LASTEXITCODE）" }
          $missing = @(Get-MissingFont)
        }
        if ($missing.Count -gt 0) { throw "書体が見つかりません: $($missing -join ', ')" }
        Write-Host "書体: $($want -join ', ')（Typst から見える）"
