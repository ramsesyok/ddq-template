# VSCode 拡張（extensions/<拡張>/）の CI。
# 拡張は 1 フォルダ = 1 つで、どれも同じ作法（npm ci / typecheck / test / build /
# check:offline / package）に揃える。増やすときは matrix.ext に足すだけでよい。
# ddq（cli/）の CI は ci.yml。
name: extension

on:
  push:
    branches: [main]
    paths: [extensions/**, .github/workflows/extension.yml]
  pull_request:
    paths: [extensions/**, .github/workflows/extension.yml]
  workflow_dispatch:

# 同じブランチへ続けて push したら古い実行は打ち切る
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: テスト (${{ matrix.ext }} / ${{ matrix.os }} / Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: extensions/${{ matrix.ext }}
    strategy:
      fail-fast: false
      matrix:
        ext: [ddq-table-editor, ddq-revision]
        os: [ubuntu-latest, windows-latest]
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: extensions/${{ matrix.ext }}/package-lock.json

      # グリッド表の記法は pandoc の解釈に強く依存するため、
      # src/formats/pandoc.test.ts を本物の pandoc に対して実行する。
      - name: pandoc を入れる (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pandoc

      - name: pandoc の版を確認
        if: runner.os == 'Linux'
        run: pandoc --version

      - run: npm ci

      - name: 型チェック
        run: npm run typecheck

      # Linux では pandoc を入れたので、スキップされたら失敗させる
      # （検査が黙って素通りするのを防ぐ）
      - name: ユニットテスト
        run: npm test
        env:
          REQUIRE_PANDOC: ${{ runner.os == 'Linux' && '1' || '' }}

      - name: ビルド
        run: npm run build

      - name: オフライン検査（実行時に通信しないこと）
        run: npm run check:offline

  # 実拡張ホスト（本物の VSCode）で動かす検証。拡張が用意していれば走らせる。
  # ランナーには VSCode が無いので @vscode/test-electron がテスト用の VSCode を取得する
  # （配布物には入らない devDependency。利用者の環境は通信しない）。
  # ddq.exe はここではビルドせず、実物の出力を採取した golden を返す差し替えを使う
  # （ddq 本体の CI は ci.yml）。
  host:
    name: 実拡張ホスト (${{ matrix.ext }})
    runs-on: windows-latest
    defaults:
      run:
        working-directory: extensions/${{ matrix.ext }}
    strategy:
      fail-fast: false
      matrix:
        ext: [ddq-revision]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: extensions/${{ matrix.ext }}/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: 検証用の VSCode をキャッシュ
        uses: actions/cache@v4
        with:
          path: extensions/${{ matrix.ext }}/.vscode-test
          key: vscode-test-${{ runner.os }}
      - run: npm run test:host

  audit:
    name: 脆弱性チェック (${{ matrix.ext }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extensions/${{ matrix.ext }}
    strategy:
      fail-fast: false
      matrix:
        ext: [ddq-table-editor, ddq-revision]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: extensions/${{ matrix.ext }}/package-lock.json
      - run: npm ci

      # 利用者へ配布されるのは本番依存だけなので、ここは必ず 0 件であること
      - name: 本番依存の脆弱性（0 件必須）
        run: npm run check:audit

      # 開発用の依存は情報として出すだけで、CI は落とさない
      - name: 開発依存の脆弱性（参考）
        run: npm audit || true

  package:
    name: VSIX の生成 (${{ matrix.ext }})
    runs-on: ubuntu-latest
    needs: [test, audit, host]
    defaults:
      run:
        working-directory: extensions/${{ matrix.ext }}
    strategy:
      fail-fast: false
      matrix:
        ext: [ddq-table-editor, ddq-revision]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: extensions/${{ matrix.ext }}/package-lock.json
      - run: npm ci

      # ddq release と同じ照合（各 package.json の version = template/VERSION）
      - name: 版の照合
        run: |
          expected=$(tr -d '[:space:]' < ../../template/VERSION)
          actual=$(node -p "require('./package.json').version")
          echo "template/VERSION=$expected ${{ matrix.ext }}/package.json=$actual"
          test "$expected" = "$actual"

      - name: パッケージ
        run: npm run package
      - name: 成果物を保存
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.ext }}-vsix
          path: 'extensions/${{ matrix.ext }}/*.vsix'
          if-no-files-found: error
