# ddq（cli/）の CI。Windows 1 本（cli/DESIGN.md §7.6）。
# ブラウザ系の golden テストは runner の Edge で動く。runner は en-US なので、
# sequenceDiagram の日本語 fallback フォントが基準環境（ja-JP）と違い配置がずれる。
# DDQ_GOLDEN_LOOSE=1 で、その差だけを許容する（tests/golden.rs 冒頭の説明）。
name: ci
env:
  DDQ_GOLDEN_LOOSE: "1"
on:
  push:
    branches: [main]
    paths: [cli/**, template/**, .github/workflows/ci.yml]
  pull_request:
    paths: [cli/**, template/**, .github/workflows/ci.yml]
jobs:
  cli:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: ddq-windows-x64
          path: cli/target/release/ddq.exe
