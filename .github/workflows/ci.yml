# ddq（cli/）の CI。Windows 1 本（cli/DESIGN.md §7.6）。
# ブラウザ系の golden テストは runner の Edge で動く。
name: ci
on:
  push:
    branches: [main]
    paths: [cli/**, template/**, .github/workflows/ci.yml]
  pull_request:
    paths: [cli/**, template/**, .github/workflows/ci.yml]
jobs:
  cli:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: ddq-windows-x64
          path: cli/target/release/ddq.exe
