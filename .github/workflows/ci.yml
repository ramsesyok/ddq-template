# ddq（cli/）の CI。Windows 1 本（cli/DESIGN.md §7.6）。配る ZIP・同梱版 VSIX の作成と検査は release-candidate.yml。
# ブラウザ系の golden テストは runner の Edge で動く。runner は en-US なので、
# sequenceDiagram の日本語 fallback フォントが基準環境（ja-JP）と違い配置がずれる。
# DDQ_GOLDEN_LOOSE=1 で、その差だけを許容する（tests/golden.rs 冒頭の説明）。
# PDF / HTML 生成の end-to-end（tests/e2e.rs）は runner に Quarto を入れて走らせる。
# DDQ_E2E=1 で「quarto が無ければ skip」を失敗にし、検査が黙って素通りしないようにする。
# runner は en-US（CP1252）なので日本語のパスはそもそも作れず、非 ASCII パスの検査は
# CP1252 で表せる文字（Übung café）で行う（日本語の検査は CP932 の手元で走る）。
# PlantUML（tests/plantuml.rs と e2e の PlantUML 図）は Java と plantuml.jar が要る。jar は
# cli/vendor/plantuml.jar（git 管理外）に MIT 版を置く決まりなので、CI では同じ場所へ
# リリースから取得してキャッシュする（版は PLANTUML_VERSION。cli/DESIGN.md §13）。
name: ci
env:
  DDQ_GOLDEN_LOOSE: "1"
  DDQ_E2E: "1"
  PLANTUML_VERSION: "1.2026.8"
on:
  push:
    branches: [main]
    # cargo test が読むファイル（pull_request と同じ。理由はその注記）
    paths: [cli/**, template/**, examples/docs/**, THIRD-PARTY-NOTICES.md, extensions/ddq-template/package-lock.json, extensions/ddq-template/src/revision/*.golden.yml, .github/workflows/ci.yml]
  pull_request:
    # cargo test が読むリポジトリ直下・拡張のファイルも含める（tests/third_party.rs が THIRD-PARTY-NOTICES.md と
    # 拡張の package-lock.json を、src/doc/revfile.rs の試験が拡張の改訂ファイルの golden を読む）
    paths: [cli/**, template/**, examples/docs/**, THIRD-PARTY-NOTICES.md, extensions/ddq-template/package-lock.json, extensions/ddq-template/src/revision/*.golden.yml, .github/workflows/ci.yml]
  workflow_dispatch:
jobs:
  cli:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli
      # 手元の検証環境と同じ版に固定する（利用マニュアル 2 章・migration/README.md 検証環境）
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.9.38
      - run: quarto --version
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/cache@v5
        id: plantuml-cache
        with:
          path: cli/vendor/plantuml.jar
          key: plantuml-mit-${{ env.PLANTUML_VERSION }}
      - if: steps.plantuml-cache.outputs.cache-hit != 'true'
        run: curl.exe -sSL -o vendor/plantuml.jar "https://github.com/plantuml/plantuml/releases/download/v${{ env.PLANTUML_VERSION }}/plantuml-mit-${{ env.PLANTUML_VERSION }}.jar"
      # 置いた jar（キャッシュから戻したものも）が、cli/vendor/README.md に記録した版の公式の MIT 版と同じこと
      - name: plantuml.jar の SHA-256 を照合
        shell: bash
        run: |
          want=$(grep -oE "${PLANTUML_VERSION} は \`sha256:[0-9a-f]{64}\`" vendor/README.md | grep -oE '[0-9a-f]{64}' || true)
          got=$(sha256sum vendor/plantuml.jar | cut -d' ' -f1)
          echo "cli/vendor/README.md の ${PLANTUML_VERSION}: ${want:-（記録なし）} / jar: $got"
          test -n "$want" && test "$want" = "$got"
      - run: java -jar vendor/plantuml.jar -version
      # 依存クレートの既知の脆弱性（RustSec）。unmaintained などの警告では落とさない
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit
      - run: cargo fmt --check
      # --locked: Cargo.lock と違う依存で試験・ビルドしない（lock が古ければ落ちる）
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --release --locked
      - uses: actions/upload-artifact@v6
        with:
          name: ddq-windows-x64
          path: cli/target/release/ddq.exe

  # ddq.exe に埋め込む template/vendor/mermaid.min.js（cli/tools/mermaid-bundle が束ねたもの）。
  # 中に固めた依存（DOMPurify・KaTeX など）も npm audit の対象にし、コミット済みの
  # mermaid.min.js と同梱一覧（bundled.json）が package-lock.json から作り直したものと同じであることを確かめる。
  mermaid-bundle:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli/tools/mermaid-bundle
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: cli/tools/mermaid-bundle/package-lock.json
      - run: npm ci
      - name: 同梱 JS の脆弱性（0 件必須）
        run: npm run check:audit
      - run: npm run build
      - name: コミット済みの mermaid.min.js と同じか
        run: git diff --exit-code --stat -- ../../../template/vendor/mermaid.min.js bundled.json
