# ddq（cli/）の CI。Windows 1 本（cli/DESIGN.md §7.6）。ほかに、その ddq.exe を同梱した VSIX のスモーク（vsix-smoke）。
# ブラウザ系の golden テストは runner の Edge で動く。runner は en-US なので、
# sequenceDiagram の日本語 fallback フォントが基準環境（ja-JP）と違い配置がずれる。
# DDQ_GOLDEN_LOOSE=1 で、その差だけを許容する（tests/golden.rs 冒頭の説明）。
# PDF / HTML 生成の end-to-end（tests/e2e.rs）は runner に Quarto を入れて走らせる。
# DDQ_E2E=1 で「quarto が無ければ skip」を失敗にし、検査が黙って素通りしないようにする。
# runner は en-US（CP1252）なので日本語のパスはそもそも作れず、非 ASCII パスの検査は
# CP1252 で表せる文字（Übung café）で行う（日本語の検査は CP932 の手元で走る）。
# PlantUML（tests/plantuml.rs と e2e の PlantUML 図）は Java と plantuml.jar が要る。jar は
# cli/vendor/plantuml.jar（git 管理外）に MIT 版を置く決まりなので、CI では同じ場所へ
# リリースから取得してキャッシュする（版は PLANTUML_VERSION。cli/DESIGN.md §13）。
name: ci
env:
  DDQ_GOLDEN_LOOSE: "1"
  DDQ_E2E: "1"
  PLANTUML_VERSION: "1.2026.8"
on:
  push:
    branches: [main]
    # extensions/ddq-template/** は同梱版のスモーク（vsix-smoke）のため
    paths: [cli/**, template/**, examples/docs/**, extensions/ddq-template/**, .github/workflows/ci.yml]
  pull_request:
    paths: [cli/**, template/**, examples/docs/**, .github/workflows/ci.yml]
  workflow_dispatch:
jobs:
  cli:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli
      # 手元の検証環境と同じ版に固定する（利用マニュアル 2 章・migration/README.md 検証環境）
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.9.38
      - run: quarto --version
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/cache@v4
        id: plantuml-cache
        with:
          path: cli/vendor/plantuml.jar
          key: plantuml-mit-${{ env.PLANTUML_VERSION }}
      - if: steps.plantuml-cache.outputs.cache-hit != 'true'
        run: curl.exe -sSL -o vendor/plantuml.jar "https://github.com/plantuml/plantuml/releases/download/v${{ env.PLANTUML_VERSION }}/plantuml-mit-${{ env.PLANTUML_VERSION }}.jar"
      - run: java -jar vendor/plantuml.jar -version
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: ddq-windows-x64
          path: cli/target/release/ddq.exe

  # 同梱版のスモーク（docs/ddq-template-study.md Q15）。上でビルドした ddq.exe を同梱した
  # ターゲット指定の VSIX を作り、展開した中身で VSCode を起動して init → html を通す。
  # 重いので PR では走らせず、main への push と手動実行だけ。
  vsix-smoke:
    if: github.event_name != 'pull_request'
    needs: cli
    runs-on: windows-latest
    defaults:
      run:
        working-directory: extensions/ddq-template
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: extensions/ddq-template/package-lock.json
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.9.38
      - uses: actions/download-artifact@v4
        with:
          name: ddq-windows-x64
          path: extensions/ddq-template/bin/win32-x64
      - run: ./bin/win32-x64/ddq.exe --version
      - run: npm ci
      - run: npm run package:win32-x64
      - name: 検証用の VSCode をキャッシュ
        uses: actions/cache@v4
        with:
          path: extensions/ddq-template/.vscode-test
          key: vscode-test-${{ runner.os }}
      - run: npm run test:smoke
      - uses: actions/upload-artifact@v4
        with:
          name: ddq-template-vsix-win32-x64
          path: extensions/ddq-template/ddq-template-win32-x64-*.vsix
          if-no-files-found: error
